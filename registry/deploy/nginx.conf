# design.auradata.mx: one nginx for the three parts.
#   /            the docs site (docs/out, a Next.js static export with trailing slashes)
#   /storybook/  the Storybook workbench (registry/storybook-static, built with relative paths)
#   /r/          the registry items (registry/public/r): the install contract, never moves
# Old Storybook links: the brand guide, Tokens and guide pages (`/?path=/docs/brand-...`) moved to the docs site and
# redirect there; every other `/?path=...` and `/iframe.html?id=...` redirects under /storybook/ with the same query.
# A location with its own add_header drops the server's: each one repeats nosniff and Referrer-Policy.

# Where an old Storybook docs page lives now (the path arrives raw or URL-encoded); empty for the stories and component docs that stay in Storybook.
map $arg_path $old_docs_page {
  default "";
  "~*^(/|%2F)docs(/|%2F)(brand-)?tokens-" /docs/brand/tokens/;
  "~*^(/|%2F)docs(/|%2F)brand-" /docs/brand/;
  "~*^(/|%2F)docs(/|%2F)guides-" /docs/guides/;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Redirects keep the scheme and host the browser used (Coolify's proxy terminates TLS in front).
  absolute_redirect off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # The docs' 404 page, for every location that ends in =404.
  error_page 404 /404.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # shadcn reads the items as JSON: npx shadcn add https://design.auradata.mx/r/kpi-card.json
  location /r/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    default_type application/json;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }

  # The static Orama index of the docs search, written as a file without an extension.
  location = /api/search {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }

  # Hashed build assets never change: Next.js chunks and Storybook's bundles.
  location /_next/static/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /storybook/assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # `/storybook` -> `/storybook/`, so the relative asset paths of the build resolve under it.
  location = /storybook {
    return 301 /storybook/$is_args$args;
  }

  location /storybook/ {
    try_files $uri $uri/ =404;
  }

  location = / {
    # A Storybook link from before the docs site: brand pages to the docs, the rest under /storybook/.
    if ($old_docs_page) {
      return 301 $old_docs_page;
    }
    if ($arg_path) {
      return 301 /storybook/?$args;
    }
    try_files /index.html =404;
  }

  # An old Storybook embed (`/iframe.html?id=...`).
  location = /iframe.html {
    return 301 /storybook/iframe.html$is_args$args;
  }

  # Docs pages: `/docs/installation/` -> docs/installation/index.html; `/docs/installation` also finds the .html.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
