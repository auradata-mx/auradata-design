name: Release

# On main: with pending changesets, opens or updates the "Version packages" pull request;
# once it is merged, publishes @auradata/tokens to npm with trusted publishing (OIDC: no npm token;
# the package trusts this workflow in its npmjs.com settings).
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - uses: changesets/action@v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          version: npx changeset version
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
